schema_version: 1

context:
  version: "10.5.2"

package:
  name: graphblas
  version: ${{ version }}

source:
  url: https://github.com/DrTimothyAldenDavis/GraphBLAS/archive/v${{ version }}.tar.gz
  sha256: 1307dd9ace59f4efb1544f74c745e31886362354286226d709749dab02b0f69e

build:
  number: 0

requirements:
  build:
    # No C++ compiler: with Fortran and CUDA off, GraphBLAS never enables C++,
    # and requiring one only added a libstdcxx/libcxx run dependency.
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  # MSVC builds use its own OpenMP runtime (vcomp140.dll, from vc14_runtime),
  # so llvm-openmp is never linked on Windows.
  host:
    - if: not win
      then: llvm-openmp
  run:
    - if: not win
      then: llvm-openmp
  run_exports:
    - ${{ pin_subpackage("graphblas", upper_bound="x.x") }}

tests:
  - package_contents:
      include:
        - suitesparse/GraphBLAS.h
      lib:
        - graphblas
      files:
        exists:
          - if: unix
            then: lib/cmake/GraphBLAS/GraphBLASConfig.cmake
            else: Library/lib/cmake/GraphBLAS/GraphBLASConfig.cmake
        not_exists:
          - if: unix
            then: lib/libgraphblas.a
            else: Library/lib/graphblas_static.lib
          # Built and run during the build to generate the JIT package
          - if: win
            then: Library/bin/grb_jitpackage.exe

about:
  homepage: https://github.com/DrTimothyAldenDavis/GraphBLAS
  repository: https://github.com/DrTimothyAldenDavis/GraphBLAS
  license: Apache-2.0
  license_file: LICENSE
  summary: SuiteSparse:GraphBLAS is a full implementation of the GraphBLAS standard

extra:
  recipe-maintainers:
    - grlee77
    - jakirkham
    - basnijholt
    - minrk
    - jayfurmanek
    - jim22k
    - eriknw
